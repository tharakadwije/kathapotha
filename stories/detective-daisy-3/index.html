  const tree = (x, y, s = 1) =>

  const pine = (x, y, s = 1, c = '#5b9a66') =>

  const bush = (x, y, s = 1) =>

  const puff = (x, y, s = 1, c = '#fff') =>

  const speed = (x, y, len = 60, n = 3, gap = 16, c = INK) =>
    Array.from({ length: n }, (_, i) => `<path d="M${x} ${y + i * gap} L${x - len + i * 10} ${y + i * gap}" stroke="${c}" stroke-width="3" stroke-linecap="round" opacity=".45"/>`).join('');
  const tear = (x, y, s = 1) =>
    `<path transform="${T(x, y, s)}" d="M0 0 Q-6 10 -5 15 Q0 21 5 15 Q6 10 0 0 Z" fill="#8ecae6" stroke="#5aa6c9" stroke-width="1.5"/>`;

  function lilyPad(cx, cy, rx, ry, c = '#8cc47a', notch = 12) {
    const a = (notch * Math.PI) / 180;

  function carrot(x, y, rot = 0, s = 1, glow = false) {

  /* ---------- buildings & landscape ---------- */

  function carrotHouse(x, y, s = 1) {
    let logs = '';
    for (let r = 0; r < 6; r++) {
      const yy = -17 - r * 30;
      const segs = r % 2 ? [[-136, -40], [-36, 136]] : [[-136, 36], [40, 136]];
      segs.forEach(([a, b], i) => {
        const right = (r + i) % 2 === 0;
        const tip = right
          ? `M${a} ${yy - 14} L${b - 26} ${yy - 14} Q${b} ${yy - 6} ${b + 6} ${yy} Q${b} ${yy + 6} ${b - 26} ${yy + 14} L${a} ${yy + 14} Q${a - 6} ${yy} ${a} ${yy - 14} Z`
          : `M${b} ${yy - 14} L${a + 26} ${yy - 14} Q${a} ${yy - 6} ${a - 6} ${yy} Q${a} ${yy + 6} ${a + 26} ${yy + 14} L${b} ${yy + 14} Q${b + 6} ${yy} ${b} ${yy - 14} Z`;
        const stubX = right ? a : b;
        const dir = right ? -1 : 1;
        logs += `<path d="${tip}" fill="${r % 2 ? '#f39237' : '#ee8428'}" ${ST} stroke-width="2.5"/>
        <path d="M${stubX} ${yy} q${dir * 14} -10 ${dir * 20} -4 q${-dir * 6} 8 ${-dir * 20} 4" fill="#6fb04a" ${ST} stroke-width="2"/>`;
      });
    }
    return `<g transform="${T(x, y, s)}" filter="url(#wob)">
    ${logs}
    <path d="M-168 -196 L0 -330 L168 -196 Z" fill="#79b85a" ${ST}/>

    const fountain = erupt

    <ellipse cx="0" cy="-280" rx="70" ry="14" fill="#ff7b2f" ${ST}/>

    <path d="M22 -272 Q38 -226 30 -190 Q42 -184 46 -200 Q46 -244 40 -272 Z" fill="#ff8a3d" ${ST} stroke-width="2"/>
    ${erupt ? `<path d="M-6 -272 Q-10 -180 -40 -110 Q-24 -100 -16 -118 Q6 -190 10 -272 Z" fill="#ffa24a" ${ST} stroke-width="2"/>` : ''}</g>`;
  }

  /* ---------- characters ---------- */
  function daisy(o = {}) {
    const { x = 0, y = 0, s = 1, flip = false, rot = 0, expr = 'happy', glass = false, bucketOn = false, carrotOn = false, cheer = false, watch = false } = o;
    let eye = `<ellipse cx="24" cy="-122" rx="10" ry="12" fill="#fff" ${ST} stroke-width="2.5"/><circle cx="27" cy="-120" r="5.5" fill="${INK}"/><circle cx="29" cy="-123" r="2" fill="#fff"/>`;
    let brow = '', extra = '';
    if (expr === 'thinking') eye = `<ellipse cx="24" cy="-122" rx="10" ry="12" fill="#fff" ${ST} stroke-width="2.5"/><circle cx="27" cy="-127" r="5.5" fill="${INK}"/><circle cx="29" cy="-130" r="2" fill="#fff"/>`;
    if (expr === 'surprised') eye = `<ellipse cx="24" cy="-122" rx="12" ry="14" fill="#fff" ${ST} stroke-width="2.5"/><circle cx="25" cy="-122" r="4" fill="${INK}"/>`;
    if (expr === 'joy') eye = `<path d="M14 -120 Q24 -134 34 -120" fill="none" ${ST} stroke-width="4"/>`;
    if (expr === 'furious') { brow = `<path d="M10 -142 L38 -130" ${ST} stroke-width="5"/>`; extra = `<ellipse cx="34" cy="-100" rx="9" ry="5" fill="#ff6b6b" opacity=".55"/>`; }
    if (expr === 'determined') brow = `<path d="M12 -140 L38 -134" ${ST} stroke-width="4.5"/>`;
    if (expr === 'worried') brow = `<path d="M14 -134 L36 -142" ${ST} stroke-width="4"/>`;

    let wing = `<path d="M-34 -76 Q-4 -96 18 -66 Q4 -34 -34 -44 Z" fill="#f5c233" ${ST}/>`;
    let items = '';
    if (glass) {
      wing = `<path d="M-14 -74 Q26 -84 44 -56 Q24 -38 -14 -48 Z" fill="#f5c233" ${ST}/>`;
      items = `<path d="M40 -52 L62 -68" stroke="#8b5a2b" stroke-width="9" stroke-linecap="round"/><path d="M40 -52 L62 -68" ${ST} stroke-width="2" opacity=".5"/>
      <circle cx="78" cy="-82" r="21" fill="#dff3fb" fill-opacity=".6" stroke="#7f8b93" stroke-width="6"/><path d="M66 -90 Q70 -98 78 -99" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    }
    if (bucketOn) {
      wing = `<path d="M-14 -76 Q30 -86 58 -66 Q40 -46 -14 -50 Z" fill="#f5c233" ${ST}/>`;
      items = bucket(80, 2, 0.85);
    }
    let backWing = '';
    if (carrotOn || cheer) {
      backWing = `<path d="M-6 -78 Q-40 -104 -64 -150 Q-62 -166 -50 -162 Q-50 -178 -36 -174 Q-30 -186 -18 -176 Q-8 -128 16 -80 Z" fill="#f5c233" ${ST}/>`;
      wing = '';
      if (carrotOn) backWing = carrot(-60, -196, 36, 0.78, true) + backWing;
    }
    const w = watch ? `<rect x="-12" y="-66" width="20" height="8" fill="#6b9e5e" transform="rotate(20 -2 -62)"/><circle cx="-2" cy="-62" r="9" fill="#fff" ${ST} stroke-width="2.5"/><path d="M-2 -62 L-2 -68 M-2 -62 L3 -60" stroke="${INK}" stroke-width="2"/>` : '';

    return `<g transform="${T(x, y, s, flip, rot)}" filter="url(#wob)">
    <path d="M-44 -74 L-70 -92 L-56 -56 Z" fill="#ffd84d" ${ST}/>
    <path d="M-24 -134 C-52 -136 -62 -106 -56 -80 C-48 -94 -38 -102 -22 -106 Z" fill="#f4a340" ${ST}/>
    <path d="M-14 -14 L-16 -4 M14 -14 L16 -4" ${ST} fill="none"/>
    <path d="M-36 0 Q-22 -14 -2 0 Z" fill="#f59e3b" ${ST}/><path d="M4 0 Q22 -14 38 0 Z" fill="#f59e3b" ${ST}/>
    <ellipse cx="0" cy="-58" rx="50" ry="48" fill="#ffd84d" ${ST}/>
    <ellipse cx="12" cy="-46" rx="28" ry="26" fill="#ffe991"/>
    <path d="M28 -92 Q4 -60 -30 -32" stroke="#7a5a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="-48" y="-44" width="32" height="26" rx="6" fill="#6b9e5e" ${ST}/><path d="M-48 -36 L-16 -36" stroke="${INK}" stroke-width="2.5"/>
    ${glass || bucketOn || carrotOn || cheer ? '' : wing}${backWing}
    <circle cx="10" cy="-118" r="36" fill="#ffd84d" ${ST}/>
    <path d="M40 -114 Q66 -116 74 -106 Q62 -94 40 -100 Z" fill="#f59e3b" ${ST}/>
    <ellipse cx="30" cy="-98" rx="7" ry="4" fill="#f7a1a1" opacity=".75"/>

    <circle cx="14" cy="-176" r="5" fill="#5a8a4e" ${ST} stroke-width="2"/>
    ${brow}
    ${glass || bucketOn ? wing : ''}${items}${w}</g>`;
  }

  function bunny(o = {}) {
    const { x = 0, y = 0, s = 1, flip = false, rot = 0, fur = '#c9a78b', inner = '#f4b6c2', belly = '#f4e6d7', bow = false, mask = false, stripes = false, expr = 'happy', armL = 18, armR = -18, carrotHug = false, carrotUp = false } = o;
    const arm = (sx, a, fill) => `<g transform="translate(${sx} -86) rotate(${a})"><ellipse cx="0" cy="22" rx="10" ry="24" fill="${fill}" ${ST}/></g>`;
    const eyeDot = (ex) => mask
      ? `<ellipse cx="${ex}" cy="-124" rx="6" ry="7" fill="#fff"/><circle cx="${ex + 1}" cy="-123" r="3.5" fill="${INK}"/>`
      : `<ellipse cx="${ex}" cy="-124" rx="4.5" ry="6" fill="${INK}"/><circle cx="${ex + 1.5}" cy="-126" r="1.6" fill="#fff"/>`;
    let eyes = eyeDot(-12) + eyeDot(12);
    let mouth = `<path d="M0 -104 Q-3 -96 -10 -98 M0 -104 Q3 -96 10 -98" fill="none" ${ST} stroke-width="2.5"/>`;
    let brows = '', fx = '';
    if (expr === 'happy') mouth = `<path d="M-11 -101 Q0 -86 11 -101" fill="#b4545a" ${ST} stroke-width="2.5"/>`;
    if (expr === 'crying') {
      eyes = `<path d="M-19 -121 Q-12 -130 -5 -121 M5 -121 Q12 -130 19 -121" fill="none" ${ST} stroke-width="3"/>`;
      mouth = `<path d="M-10 -94 Q0 -104 10 -94" fill="none" ${ST} stroke-width="3"/>`;
      brows = `<path d="M-22 -134 L-8 -140 M8 -140 L22 -134" ${ST} stroke-width="3"/>`;

      return `<section class="page art"><div class="art-frame" role="img" aria-label="Daisy cheering beside her birthday cake, with sparkles all around.">${S.end()}</div></section>
        <section class="page end-page"><h2>The End</h2><p>Happy birthday, Daisy! Her friends kept the secret all day long.</p>
        <button class="pill" type="button" data-go="0">Read it again</button>${window.StorySite ? StorySite.endButtons() : ''}</section>`;
    }
    const firstOfChapter = !!p.opens;
    return `<section class="page art"><div class="art-frame" role="img" aria-label="${p.alt}">${S[p.art]()}</div></section>
      <section class="page words${firstOfChapter ? ' opens' : ''}">
        ${firstOfChapter ? `<h2 class="chapter">${p.ch}</h2>${squiggle}` : `<p class="running">${p.ch}</p>`}
        ${p.text.map((t) => `<p class="text">${t}</p>`).join('')}
        <span class="folio">${i + 1}</span>
      </section>`;
  }

  function go(i, fromLoad) {
    if (i < 0 || i >= total) return;
    const dir = i >= current ? 'turn-next' : 'turn-prev';
    voice.stop();
    current = i;
    seen.add(i);
    book.classList.remove('turn-next', 'turn-prev', 'single');
    book.innerHTML = pageHTML(i);
    if (pages[i].type === 'cast') book.classList.add('single');
    if (!fromLoad) { void book.offsetWidth; book.classList.add(dir); }
    prev.disabled = i === 0;
    next.disabled = i === total - 1;
    count.textContent = `${i + 1} / ${total}`;
    trail.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('seen', seen.has(k));
      if (k === i) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    readTools.hidden = !canRead || pages[i].type !== 'story';
    try { localStorage.setItem(KEY, String(i)); } catch (e) {}
    if (!fromLoad && window.matchMedia('(max-width: 760px)').matches) window.scrollTo({ top: 0 });
  }

  book.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(Number(b.dataset.go)); });
  prev.addEventListener('click', () => go(current - 1));
  next.addEventListener('click', () => go(current + 1));
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight') { go(current + 1); }
    if (e.key === 'ArrowLeft') { go(current - 1); }
  });
  let sx = null, sy = null;
  book.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  book.addEventListener('touchend', (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(current + (dx < 0 ? 1 : -1));
    sx = null;
  });

  let start = 0;
  try { const v = Number(localStorage.getItem(KEY)); if (Number.isInteger(v) && v >= 0 && v < total) start = v; } catch (e) {}
  for (let k = 0; k <= start; k++) seen.add(k);
  go(start, true);
})();
</script>
</body>
</html>
