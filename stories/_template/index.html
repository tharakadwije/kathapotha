<!doctype html>
<!--
  STORY TEMPLATE
  1. Copy this whole folder and rename it, e.g. stories/my-new-story/
  2. Change data-story below to the story's id from assets/library.js
  3. Write the story in window.STORY further down
  4. Put pictures (drawings, photos, png/jpg/svg) in the pictures folder
  5. Add the story to assets/library.js with status "ready" and published: "YYYY-MM-DD" (the day it goes live)
  Full checklist: .genAiDoc/new-book-checklist.md
-->

<script>
window.STORY = {
  title: "My Story Title",
  subtitle: "and a second line if you want one",
  by: "our young author",
  intro: "A story in two chapters. Turn the pages with the buttons below, or use the arrow keys.",
  coverEmoji: "🌈",                 // or coverPicture: "pictures/cover.png"
  coverAlt: "A big rainbow.",
  theme: { accent: "#b0487a", heading: "#3f6fa0" },

  pages: [
    {
      chapter: "Chapter One",
      picture: "pictures/example.svg",
      alt: "A rainbow over green hills with the sun shining.",

        "Write the first page of the story here.",

      ]
    },
    {
      chapter: "Chapter One",
      emoji: "🐢",
      alt: "A turtle.",
      text: ["No drawing for this page yet? Use an emoji instead of a picture."]
