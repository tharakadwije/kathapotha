<!doctype html>
<html lang="en" data-root="../../" data-story="night-owl-woods">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛺</text></svg>">
<title>Detective Daisy and the Night Owl Woods Camping Trip</title>
<script src="../../assets/library.js"></script>
<script src="../../assets/story-kit.js"></script>
<script src="../../assets/read-aloud.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --pond: #cfe7de;
  --pond-pad: #b9dccd;
  --chrome-ink: #2e4a3e;
  --paper: #fffaf0;
  --paper-shade: #efe4cf;
  --ink: #4a3728;
  --ink-soft: #7a6552;
  --leaf: #4f7f3f;
  --carrot: #e57c1f;
  --btn: #fffaf0;
  --btn-ink: #2e4a3e;
  --focus: #2a6fb5;
  --shadow: 0 18px 40px -18px rgba(38, 60, 50, .55);
  --display: "Grandstander", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  --body: "Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pond: #15302c; --pond-pad: #1d3d37; --chrome-ink: #d5eadf;
    --paper: #f7eedb; --paper-shade: #dccaa7;
    --btn: #244640; --btn-ink: #e8f4ee; --focus: #8cc6ff;
    --shadow: 0 18px 40px -16px rgba(0, 0, 0, .7);
  }
}
:root[data-theme="dark"] {
  --pond: #15302c; --pond-pad: #1d3d37; --chrome-ink: #d5eadf;
  --paper: #f7eedb; --paper-shade: #dccaa7;
  --btn: #244640; --btn-ink: #e8f4ee; --focus: #8cc6ff;
  --shadow: 0 18px 40px -16px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--pond);
  background-image:
    radial-gradient(ellipse 90px 30px at 12% 18%, var(--pond-pad) 98%, transparent 100%),
    radial-gradient(ellipse 70px 24px at 88% 12%, var(--pond-pad) 98%, transparent 100%),
    radial-gradient(ellipse 110px 34px at 92% 86%, var(--pond-pad) 98%, transparent 100%),
    radial-gradient(ellipse 60px 20px at 6% 80%, var(--pond-pad) 98%, transparent 100%);
  background-attachment: fixed;
  color: var(--chrome-ink);
  font-family: var(--body);
  display: flex;
  flex-direction: column;
  min-height: 100svh;
}
button { font: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 8px; }

.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: min(1180px, 94vw); margin: 0 auto; padding: 14px 0 10px;
}
.bar-title { font-family: var(--display); font-weight: 800; font-size: 1.15rem; letter-spacing: .01em; }
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--btn); color: var(--btn-ink);
  border: 2px solid currentColor; border-radius: 999px;
  padding: 7px 16px; cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 1rem;
  box-shadow: 0 3px 0 rgba(0,0,0,.18);
}
.pill:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.pill[disabled] { opacity: .4; cursor: default; transform: none; }
.pill svg { width: 22px; height: 22px; flex: none; }
a.pill { text-decoration: none; }
.bar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.shelf-link svg { width: 20px; height: 20px; }
@media (max-width: 520px) { .bar-title { display: none; } }

main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 0 8px; }

.book {
  position: relative;
  width: min(1180px, 96vw, calc((100svh - 150px) * 2.4));
  aspect-ratio: 2.4 / 1;
  background: var(--paper);
  border-radius: 6px 14px 14px 6px;
  box-shadow: var(--shadow), 0 0 0 1px rgba(74,55,40,.12);
  display: grid; grid-template-columns: 1fr 1fr;
  overflow: hidden;
  touch-action: pan-y;
}
.book::after {
  content: ""; position: absolute; inset: 0 auto 0 50%; width: 70px; transform: translateX(-50%);
  background: linear-gradient(90deg, transparent, rgba(120,90,50,.16) 45%, rgba(80,60,30,.26) 50%, rgba(120,90,50,.16) 55%, transparent);
  pointer-events: none;
}
.book.single::after { display: none; }
.book.turn-next > * { animation: turnNext .45s ease-out; }
.book.turn-prev > * { animation: turnPrev .45s ease-out; }
@keyframes turnNext { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes turnPrev { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

.page { position: relative; min-width: 0; min-height: 0; padding: clamp(18px, 3.2vw, 46px) clamp(20px, 3.6vw, 52px); color: var(--ink); overflow: auto; }
.page.art { padding: 0; }
.art-frame { position: absolute; inset: clamp(12px, 1.6vw, 22px); }
.art-frame svg { width: 100%; height: 100%; display: block; border-radius: 12px; }
.page.words { display: flex; flex-direction: column; }

.chapter {
  font-family: var(--display); font-weight: 800; color: var(--leaf);
  font-size: clamp(1.5rem, 2.5vw, 2.15rem); line-height: 1.1; margin: 0 0 .15em;
}
.squiggle { flex: none; display: block; width: 120px; height: 12px; margin: 0 0 .9em; color: var(--carrot); }
.running { font-family: var(--display); font-weight: 600; color: var(--ink-soft); font-size: .95rem; margin: 0 0 .9em; }
.words p.text { font-size: clamp(1.02rem, 1.52vw, 1.27rem); line-height: 1.62; margin: 0 0 .7em; max-width: 34em; }
.words.opens p.text:first-of-type::first-letter {
  font-family: var(--display); font-weight: 800; color: var(--carrot);
  float: left; font-size: 3.1em; line-height: .9; padding: .06em .1em 0 0;
}
.folio { margin-top: auto; padding-top: .6em; font-family: var(--display); font-weight: 600; color: var(--ink-soft); font-size: .9rem; align-self: flex-end; }
.page.art .folio { position: absolute; left: 22px; bottom: 8px; }

/* cover */
.title-page { display: flex; flex-direction: column; justify-content: center; gap: clamp(10px, 1.6vw, 22px); background: linear-gradient(160deg, var(--paper) 55%, var(--paper-shade)); }
.title-page h1 { margin: 0; font-family: var(--display); color: var(--leaf); line-height: .95; }
.title-page .t1 { display: block; font-size: clamp(2.6rem, 5.6vw, 4.9rem); font-weight: 800; }
.title-page .t2 { display: block; margin-top: .35em; font-size: clamp(1.15rem, 2.1vw, 1.8rem); font-weight: 600; color: var(--ink); line-height: 1.15; }
.title-page .byline { margin: 0; font-family: "Grandstander", sans-serif; font-weight: 800; color: var(--carrot); font-size: clamp(1rem, 1.5vw, 1.28rem); }
.title-page .hint { margin: 0; color: var(--ink-soft); font-size: clamp(.98rem, 1.3vw, 1.1rem); max-width: 26em; }
.title-page .pill { align-self: flex-start; background: var(--leaf); color: #fffaf0; border-color: var(--leaf); font-size: 1.12rem; padding: 10px 22px; }

/* characters */
.cast { grid-column: 1 / -1; padding: clamp(16px, 2.6vw, 38px) clamp(20px, 3.6vw, 52px); display: flex; flex-direction: column; overflow: auto; color: var(--ink); }
.cast h2 { margin: 0 0 .5em; font-family: var(--display); font-weight: 800; color: var(--leaf); font-size: clamp(1.5rem, 2.5vw, 2.15rem); }
.cast ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 1.4vw, 18px) clamp(14px, 3vw, 40px); flex: 1; }
.cast li { display: grid; grid-template-columns: clamp(70px, 9vw, 120px) 1fr; align-items: center; gap: 14px; }
.cast .portrait { aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff 0 40%, var(--paper-shade) 100%); border: 3px solid var(--ink); display: grid; place-items: center; overflow: hidden; padding: 5%; }
.cast .portrait svg { width: 100%; height: 100%; }
.cast .name { font-family: var(--display); font-weight: 800; font-size: clamp(1.1rem, 1.7vw, 1.45rem); margin: 0; color: var(--ink); }
.cast .what { margin: .1em 0 0; font-size: clamp(.95rem, 1.25vw, 1.08rem); color: var(--ink-soft); line-height: 1.35; }

/* end */
.end-page { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 14px; }
.end-page h2 { margin: 0; font-family: var(--display); font-weight: 800; color: var(--carrot); font-size: clamp(3rem, 6.4vw, 5.6rem); line-height: 1; transform: rotate(-3deg); }
.end-page p { margin: 0; font-size: clamp(1.02rem, 1.5vw, 1.25rem); max-width: 24em; }

/* navigation */
.turns { width: min(1180px, 96vw); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 6px; }
.trail { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
.trail button {
  width: 30px; height: 34px; padding: 0; border: 0; background: transparent; cursor: pointer; color: var(--chrome-ink); opacity: .35;
  display: grid; place-items: center;
}
.trail li:nth-child(odd) button { transform: translateY(-5px) rotate(-8deg); }
.trail li:nth-child(even) button { transform: translateY(5px) rotate(8deg); }
.trail button svg { width: 20px; height: 22px; }
.trail button.seen { opacity: .75; }
.trail button[aria-current="page"] { opacity: 1; color: var(--carrot); }
.trail button[aria-current="page"] svg { width: 26px; height: 28px; }
.label-short { display: none; }
.count { display: none; font-family: var(--display); font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 1020px) {
  .trail button { width: 22px; }
  .trail button svg { width: 16px; height: 18px; }
}
@media (max-width: 760px) {
  .bar { width: 92vw; flex-wrap: wrap; row-gap: 8px; }
  .bar-title { font-size: 1rem; }
  main { justify-content: flex-start; padding-bottom: 84px; }
  .book { width: 94vw; aspect-ratio: auto; grid-template-columns: 1fr; border-radius: 12px; }
  .book::after { display: none; }
  .page { overflow: visible; }
  .page.art { aspect-ratio: 4 / 3; }
  .art-frame { inset: 10px; }
  .page.art .folio { display: none; }
  .title-page { order: 2; }
  .cast ul { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 520px) {
  .cast ul { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .cast li { grid-template-columns: 64px 1fr; gap: 10px; }
  .end-page { order: 2; }
  .turns { position: fixed; bottom: 0; left: 0; right: 0; width: auto; padding: 10px 4vw calc(10px + env(safe-area-inset-bottom)); background: var(--pond); box-shadow: 0 -8px 20px -12px rgba(0,0,0,.35); z-index: 5; }
  .trail { display: none; }
  .count { display: block; }
  .pill .label-long { display: none; }
  .pill .label-short { display: inline; }
}
@media (prefers-reduced-motion: reduce) {
  .book.turn-next > *, .book.turn-prev > * { animation: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <filter id="wob" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.2  0.35 0 0 0 -0.1"/></filter>
  <filter id="wash" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  <radialGradient id="glow"><stop offset="0" stop-color="#fff6b0" stop-opacity="1"/><stop offset=".55" stop-color="#ffe680" stop-opacity=".55"/><stop offset="1" stop-color="#ffe680" stop-opacity="0"/></radialGradient>
  <radialGradient id="lavaGlow"><stop offset="0" stop-color="#ffd166"/><stop offset=".45" stop-color="#ff8a3d" stop-opacity=".65"/><stop offset="1" stop-color="#ff7b2f" stop-opacity="0"/></radialGradient>
  <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9e0f0"/><stop offset="1" stop-color="#f1f9ee"/></linearGradient>
  <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4b39a"/><stop offset=".6" stop-color="#fbd9b5"/><stop offset="1" stop-color="#fdeccf"/></linearGradient>
  <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9dbd9"/><stop offset="1" stop-color="#cdebdc"/></linearGradient>
  <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#f4efe6"/><rect width="16" height="8" fill="#43414a"/></pattern>
  </defs></svg>
<header class="bar">
  <div class="bar-left">
    <a class="pill shelf-link" data-site-link="home" href="../../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Story Shelf</span></a>
    <span class="bar-title">Detective Daisy</span>
  </div>
  <div class="read-tools" id="read-tools" hidden>
    <div class="voice-pick" id="voice-pick"></div>
    <button class="pill" id="read" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <span id="read-label">Read this page</span>
    </button>
  </div>
</header>

<main>
  <div class="book" id="book" aria-live="polite"></div>
  <nav class="turns" aria-label="Turn pages">
    <button class="pill" id="prev" type="button">
      <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M30 12c0-3-3-5-8-5L4 11.2c-1 .3-1 1.3 0 1.6L22 17c5 0 8-2 8-5z" fill="#ec8424" stroke="#4a3728" stroke-width="1.8" stroke-linejoin="round"/><path d="M26 9l5-5M27 12h5M26 15l5 5" stroke="#5f9e4e" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Back</span>
    </button>
    <ol class="trail" id="trail"></ol>
    <span class="count" id="count" aria-hidden="true"></span>
    <button class="pill" id="next" type="button">
      <span><span class="label-long">Next page</span><span class="label-short">Next</span></span>
      <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2 12c0-3 3-5 8-5l18 4.2c1 .3 1 1.3 0 1.6L10 17c-5 0-8-2-8-5z" fill="#ec8424" stroke="#4a3728" stroke-width="1.8" stroke-linejoin="round"/><path d="M6 9L1 4M5 12H0M6 15l-5 5" stroke="#5f9e4e" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </nav>
</main>

<script>
(function (root) {
  const INK = '#4a3728';
  const ST = `stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
  const T = (x, y, s = 1, flip = false, rot = 0) =>
    `translate(${x} ${y}) rotate(${rot}) scale(${flip ? -s : s} ${s})`;

  const DEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <filter id="wob" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.2  0.35 0 0 0 -0.1"/></filter>
  <filter id="wash" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  <radialGradient id="glow"><stop offset="0" stop-color="#fff6b0" stop-opacity="1"/><stop offset=".55" stop-color="#ffe680" stop-opacity=".55"/><stop offset="1" stop-color="#ffe680" stop-opacity="0"/></radialGradient>
  <radialGradient id="lavaGlow"><stop offset="0" stop-color="#ffd166"/><stop offset=".45" stop-color="#ff8a3d" stop-opacity=".65"/><stop offset="1" stop-color="#ff7b2f" stop-opacity="0"/></radialGradient>
  <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9e0f0"/><stop offset="1" stop-color="#f1f9ee"/></linearGradient>
  <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4b39a"/><stop offset=".6" stop-color="#fbd9b5"/><stop offset="1" stop-color="#fdeccf"/></linearGradient>
  <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9dbd9"/><stop offset="1" stop-color="#cdebdc"/></linearGradient>
  <linearGradient id="skyMorn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8d8ea"/><stop offset=".55" stop-color="#d8eef0"/><stop offset="1" stop-color="#f3f7e6"/></linearGradient>
  <linearGradient id="skyEve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3f66"/><stop offset=".55" stop-color="#6b6f9e"/><stop offset="1" stop-color="#c9a7b0"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ecae6"/><stop offset="1" stop-color="#bde5ea"/></linearGradient>
  <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0" stop-opacity=".85"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></linearGradient>
  <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#f4efe6"/><rect width="16" height="8" fill="#43414a"/></pattern>
  </defs></svg>`;

  /* ---------- small props ---------- */
  const cloud = (x, y, s = 1, c = '#fff') =>
    `<g transform="${T(x, y, s)}" fill="${c}" opacity=".95"><ellipse cx="0" cy="0" rx="50" ry="22"/><circle cx="-24" cy="-10" r="22"/><circle cx="12" cy="-20" r="29"/><circle cx="40" cy="-4" r="18"/></g>`;
  const tuft = (x, y, s = 1, c = '#5f9e4e') =>
    `<path transform="${T(x, y, s)}" d="M-10 0 Q-9 -12 -5 -17 Q-4 -6 0 0 Q1 -17 6 -22 Q6 -8 5 0 Q9 -10 13 -13 Q11 -4 9 0" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>`;
  const flower = (x, y, c = '#f59bbd', s = 1) =>
    `<g transform="${T(x, y, s)}"><path d="M0 0 L0 -22" stroke="#5f9e4e" stroke-width="2.5"/>${[0, 72, 144, 216, 288]
      .map((a) => `<ellipse cx="0" cy="-8" rx="5" ry="8" fill="${c}" transform="translate(0 -26) rotate(${a})"/>`)
      .join('')}<circle cx="0" cy="-26" r="4.5" fill="#ffd447"/></g>`;
  const sparkle = (x, y, r = 8, c = '#ffd23f') =>
    `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r} Z" fill="${c}" stroke="#d99a12" stroke-width="1.5" stroke-linejoin="round"/>`;
  const mark = (x, y, ch, size = 46, c = INK, rot = 0) =>
    `<text x="${x}" y="${y}" font-family="Grandstander, 'Comic Sans MS', sans-serif" font-weight="800" font-size="${size}" fill="${c}" text-anchor="middle" transform="rotate(${rot} ${x} ${y})">${ch}</text>`;
  const pawPrint = (x, y, rot = 0, s = 1) =>
    `<g transform="${T(x, y, s, false, rot)}" fill="#8a6a4c" opacity=".6"><ellipse cx="0" cy="0" rx="9" ry="13"/><circle cx="-9" cy="-17" r="4.2"/><circle cx="0" cy="-22" r="4.2"/><circle cx="9" cy="-17" r="4.2"/></g>`;
  const tree = (x, y, s = 1) =>
    `<g transform="${T(x, y, s)}"><path d="M-10 0 L-7 -70 L7 -70 L10 0 Z" fill="#9a6b45" ${ST}/><circle cx="0" cy="-104" r="48" fill="#7dbb6a" ${ST}/><circle cx="-34" cy="-80" r="30" fill="#7dbb6a" ${ST}/><circle cx="34" cy="-82" r="30" fill="#7dbb6a" ${ST}/><circle cx="-12" cy="-116" r="14" fill="#9bd08a"/></g>`;
  const pine = (x, y, s = 1, c = '#5b9a66') =>
    `<g transform="${T(x, y, s)}"><rect x="-5" y="-16" width="10" height="16" fill="#8a5e3c"/><path d="M-28 -14 L0 -60 L28 -14 Z M-22 -40 L0 -84 L22 -40 Z" fill="${c}" ${ST} stroke-width="2.5"/></g>`;

  function carrotHouse(x, y, s = 1) {

        const tip = right
          ? `M${a} ${yy - 14} L${b - 26} ${yy - 14} Q${b} ${yy - 6} ${b + 6} ${yy} Q${b} ${yy + 6} ${b - 26} ${yy + 14} L${a} ${yy + 14} Q${a - 6} ${yy} ${a} ${yy - 14} Z`

    if (expr === 'surprised') eye = `<ellipse cx="24" cy="-122" rx="12" ry="14" fill="#fff" ${ST} stroke-width="2.5"/><circle cx="25" cy="-122" r="4" fill="${INK}"/>`;

    return `<g transform="${T(x, y, s, flip, rot)}" filter="url(#wob)">

  function bunny(o = {}) {

      : `<ellipse cx="${ex}" cy="-124" rx="4.5" ry="6" fill="${INK}"/><circle cx="${ex + 1.5}" cy="-126" r="1.6" fill="#fff"/>`;
    let eyes = eyeDot(-12) + eyeDot(12);

    let brows = '', fx = '';
    if (expr === 'happy') mouth = `<path d="M-11 -101 Q0 -86 11 -101" fill="#b4545a" ${ST} stroke-width="2.5"/>`;

      eyes = `<path d="M-19 -121 Q-12 -130 -5 -121 M5 -121 Q12 -130 19 -121" fill="none" ${ST} stroke-width="3"/>`;

    }

      mouth = `<ellipse cx="0" cy="-95" rx="5" ry="7" fill="${INK}"/>`;

    if (expr === 'worried' || expr === 'sorry') {

    return `<g transform="${T(x, y, s, flip, rot)}" filter="url(#wob)">${hugGlow}

<script>
(function () {
  const S = Art.scenes;
  const squiggle = '<svg class="squiggle" viewBox="0 0 120 12" aria-hidden="true"><path d="M2 7 Q12 1 22 7 T42 7 T62 7 T82 7 T102 7 T118 6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>';

  const story = [
    { ch: 'Chapter One', opens: true, art: 'c1a', alt: 'Daisy the duck walks along a path into Night Owl Woods, humming a tune. A sleepy owl watches from a tree.', text: [
      '“Fa halla la didi daida, na na na na na nand,” Daisy hummed as she walked through Night Owl Woods. She was going camping!',
      'Daisy was excited about her very first camping trip. “Ooh, what should I do first? Hmm… ah ha! Maybe I will set up my camp,” said Daisy.' ] },
    { ch: 'Chapter One', art: 'c1b', alt: 'Daisy and Rebecca stand beside a red tent with a campfire and a pile of firewood.', text: [
      'So Daisy started making her camp. Rebecca was there with Daisy too. It was the first camping trip for both of them.' ] },
    { ch: 'Chapter One', art: 'c1c', alt: 'Rebecca pulls a yellow-eyed fish from the pond while Daisy waits with her line in the water.', text: [
      'Next, Rebecca and Daisy started fishing. Rebecca showed Daisy how to fish. In only ten minutes Rebecca caught a yellow-eyed fish, but Daisy still hadn’t caught anything at all.' ] },
    { ch: 'Chapter Two', opens: true, art: 'c2a', alt: 'Daisy pulls hard on her fishing rod and a small blue fish comes flying out of the water.', text: [
      '“Whoa, oh oh ho, I think I got a really big one!” yelled Daisy. But Daisy was wrong.',
      '“It was just Bonnie the fish. He is little, but he is really heavy,” said Rebecca.',
      '“Oops, sorry,” Bonnie apologised. “I’m really sorry. I thought that was food.” Then Bonnie jumped back into the water with a splash!' ] },
    { ch: 'Chapter Two', art: 'c2b', alt: 'Daisy swings an axe deep in the woods, with tree stumps and a pile of logs around her.', text: [
      'Rebecca asked Daisy if she could get some wood for their fire. Daisy said, “Okey dokey,” and giggled her way deeper into the woods.' ] },
    { ch: 'Chapter Two', art: 'c2c', alt: 'Fallen logs have piled up all around Daisy, trapping her inside like a cage.', text: [
      'But as Daisy chopped the twentieth tree, all the trees she had chopped came down around her and trapped her inside!' ] },
    { ch: 'Chapter Three', opens: true, art: 'c3a', alt: 'Daisy calls out from inside the logs while Golden the eagle swoops down through the dark woods.', text: [
      '“Gulp… Rebecca? Um, hello, Rebecca, are you here? It’s me, Daisy!” Daisy shivered in the deep woods.',
      'Bravely, Daisy called Golden the eagle for some advice.' ] },
    { ch: 'Chapter Three', art: 'c3b', alt: 'Golden the eagle moves the logs away while Nyla the owl looks out from a hole in a tall tree.', text: [
      'Golden said, “Why did you chop this tree? That was my neighbour’s house!”',
      'Daisy asked, “Is your neighbour a night owl?”',
      '“Um, well, yes, of course. This is Night Owl Woods, and his name is Nyla, the owl of the woods,” said Golden.',
      'Daisy said she was very sorry about chopping the tree. She had needed some wood for her camp. Golden accepted her apology and unblocked the trees for her.' ] },
    { ch: 'Chapter Four', opens: true, art: 'c4a', alt: 'Rebecca waits worriedly by the tent and campfire at dusk, with no sign of Daisy.', text: [
      'But Golden flew away without telling Daisy the way out.',
      'Back at the campsite, Rebecca was worried about Daisy. She hadn’t come back for two days, and Rebecca didn’t want that to turn into three.',
      'So Rebecca quickly went into the woods to check on Daisy.' ] },
    { ch: 'Chapter Four', art: 'c4b', alt: 'Rebecca holds her book of nature as a bright beam of sunlight points down at her.', text: [
      'Rebecca saw a bright light in her book of nature. It showed that when the sun points at a bunny, a duck can find them.',
      'So Rebecca asked Sunny the sun to point straight at her.' ] },
    { ch: 'Chapter Five', opens: true, art: 'c5a', alt: 'Daisy, free of the logs, follows a golden beam of sunlight through the trees.', text: [
      'Daisy saw the light that Rebecca had made. She followed it, and it led her all the way out of the deep woods.' ] },
    { ch: 'Chapter Five', art: 'c5b', alt: 'Daisy and Rebecca back at camp under a rainbow, cheering together.', text: [
      'Daisy looked at Rebecca and said, “You are a real hero. You used your kindness, with all of your heart. Thank you for saving me, Rebecca.”' ] },
  ];

  const cast = [
    ['daisy', 'Daisy', 'A duck on her first camping trip'],
    ['rebecca', 'Rebecca', 'A bunny who knows how to fish'],
    ['bonnie', 'Bonnie', 'A little fish who is very heavy'],
    ['golden', 'Golden', 'An eagle who gives advice'],
    ['nyla', 'Nyla', 'The owl of Night Owl Woods'],
    ['sunny', 'Sunny', 'The sun, who can point the way'],
  ];

  const pages = [{ type: 'cover' }, { type: 'cast' }, ...story.map((p) => Object.assign({ type: 'story' }, p)), { type: 'end' }];
  const total = pages.length;

  const book = document.getElementById('book');
  const trail = document.getElementById('trail');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const count = document.getElementById('count');
  const readTools = document.getElementById('read-tools');
  const KEY = 'storyshelf:night-owl-woods:page';

  let current = 0;
  const canRead = !!(window.ReadAloud && ReadAloud.supported);
  const voice = canRead ? ReadAloud.attach({
    button: document.getElementById('read'),
    label: document.getElementById('read-label'),
    picker: document.getElementById('voice-pick'),
    getText: () => {
      const p = pages[current];
      return p.type === 'story' ? (p.opens ? p.ch + '. ' : '') + p.text.join(' ') : '';
    },
  }) : { stop() {} };
  const seen = new Set([0]);

  const foot = '<svg viewBox="0 0 24 26" aria-hidden="true"><path d="M12 25 C9 25 8 22 8.6 19 L2.4 7.6 C4.6 8.2 6.8 9 8.4 10.8 L9.4 2.6 C10.8 4.6 11.6 7 12 9.4 C12.4 7 13.2 4.6 14.6 2.6 L15.6 10.8 C17.2 9 19.4 8.2 21.6 7.6 L15.4 19 C16 22 15 25 12 25 Z" fill="currentColor"/></svg>';
  trail.innerHTML = pages.map((_, i) => `<li><button type="button" data-i="${i}" aria-label="Go to page ${i + 1}">${foot}</button></li>`).join('');
  trail.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(Number(b.dataset.i)); });

  function pageHTML(i) {
    const p = pages[i];
    if (p.type === 'cover') {
      return `<section class="page title-page">
          <h1><span class="t1">Detective Daisy</span><span class="t2">and the Night Owl Woods Camping Trip</span></h1>
          <p class="byline">Written by Akie</p>
          ${window.StorySite ? StorySite.publishedLine() : ''}
          <p class="hint">A story in five chapters. Turn the pages with the buttons below, or use the arrow keys.</p>
          <button class="pill" type="button" data-go="1">Open the book</button>
        </section>
        <section class="page art"><div class="art-frame" role="img" aria-label="Daisy the duck and Rebecca the bunny at their campsite at night, with a tent, a campfire and an owl watching from the trees.">${S.cover()}</div></section>`;
    }
    if (p.type === 'cast') {
      return `<section class="cast"><h2>Meet the characters</h2><ul>${cast.map(([k, n, w]) =>
        `<li><div class="portrait">${Art.portraits[k]}</div><div><p class="name">${n}</p><p class="what">${w}</p></div></li>`).join('')}</ul>
        <span class="folio">${i + 1}</span></section>`;
    }
    if (p.type === 'end') {
      return `<section class="page art"><div class="art-frame" role="img" aria-label="Daisy and Rebecca cheering together with sparkles around them.">${S.end()}</div></section>
        <section class="page end-page"><h2>The End</h2><p>Daisy is safely back at camp, all thanks to her kind friend Rebecca.</p>
        <button class="pill" type="button" data-go="0">Read it again</button>${window.StorySite ? StorySite.endButtons() : ''}</section>`;
    }
    const firstOfChapter = !!p.opens;
    return `<section class="page art"><div class="art-frame" role="img" aria-label="${p.alt}">${S[p.art]()}</div></section>
      <section class="page words${firstOfChapter ? ' opens' : ''}">
        ${firstOfChapter ? `<h2 class="chapter">${p.ch}</h2>${squiggle}` : `<p class="running">${p.ch}</p>`}
        ${p.text.map((t) => `<p class="text">${t}</p>`).join('')}
        <span class="folio">${i + 1}</span>
      </section>`;
  }

  function go(i, fromLoad) {
    if (i < 0 || i >= total) return;
    const dir = i >= current ? 'turn-next' : 'turn-prev';
    voice.stop();
    current = i;
    seen.add(i);
    book.classList.remove('turn-next', 'turn-prev', 'single');
    book.innerHTML = pageHTML(i);
    if (pages[i].type === 'cast') book.classList.add('single');
    if (!fromLoad) { void book.offsetWidth; book.classList.add(dir); }
    prev.disabled = i === 0;
    next.disabled = i === total - 1;
    count.textContent = `${i + 1} / ${total}`;
    trail.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('seen', seen.has(k));
      if (k === i) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    readTools.hidden = !canRead || pages[i].type !== 'story';
    try { localStorage.setItem(KEY, String(i)); } catch (e) {}
    if (!fromLoad && window.matchMedia('(max-width: 760px)').matches) window.scrollTo({ top: 0 });
  }

  book.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(Number(b.dataset.go)); });
  prev.addEventListener('click', () => go(current - 1));
  next.addEventListener('click', () => go(current + 1));
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight') { go(current + 1); }
    if (e.key === 'ArrowLeft') { go(current - 1); }
  });
  let sx = null, sy = null;
  book.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  book.addEventListener('touchend', (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(current + (dx < 0 ? 1 : -1));
    sx = null;
  });

  let start = 0;
  try { const v = Number(localStorage.getItem(KEY)); if (Number.isInteger(v) && v >= 0 && v < total) start = v; } catch (e) {}
  for (let k = 0; k <= start; k++) seen.add(k);
  go(start, true);
})();
</script>
