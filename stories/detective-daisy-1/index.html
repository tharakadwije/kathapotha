  function carrotHouse(x, y, s = 1) {
    let logs = '';

      segs.forEach(([a, b], i) => {
        const right = (r + i) % 2 === 0;
        const tip = right
          ? `M${a} ${yy - 14} L${b - 26} ${yy - 14} Q${b} ${yy - 6} ${b + 6} ${yy} Q${b} ${yy + 6} ${b - 26} ${yy + 14} L${a} ${yy + 14} Q${a - 6} ${yy} ${a} ${yy - 14} Z`

        logs += `<path d="${tip}" fill="${r % 2 ? '#f39237' : '#ee8428'}" ${ST} stroke-width="2.5"/>

    if (expr === 'surprised') eye = `<ellipse cx="24" cy="-122" rx="12" ry="14" fill="#fff" ${ST} stroke-width="2.5"/><circle cx="25" cy="-122" r="4" fill="${INK}"/>`;

      wing = '';

    const w = watch ? `<rect x="-12" y="-66" width="20" height="8" fill="#6b9e5e" transform="rotate(20 -2 -62)"/><circle cx="-2" cy="-62" r="9" fill="#fff" ${ST} stroke-width="2.5"/><path d="M-2 -62 L-2 -68 M-2 -62 L3 -60" stroke="${INK}" stroke-width="2"/>` : '';

    return `<g transform="${T(x, y, s, flip, rot)}" filter="url(#wob)">

    <path d="M28 -92 Q4 -60 -30 -32" stroke="#7a5a3a" stroke-width="5" fill="none" stroke-linecap="round"/>

      : `<ellipse cx="${ex}" cy="-124" rx="4.5" ry="6" fill="${INK}"/><circle cx="${ex + 1.5}" cy="-126" r="1.6" fill="#fff"/>`;
    let eyes = eyeDot(-12) + eyeDot(12);
    let mouth = `<path d="M0 -104 Q-3 -96 -10 -98 M0 -104 Q3 -96 10 -98" fill="none" ${ST} stroke-width="2.5"/>`;
    let brows = '', fx = '';
    if (expr === 'happy') mouth = `<path d="M-11 -101 Q0 -86 11 -101" fill="#b4545a" ${ST} stroke-width="2.5"/>`;
    if (expr === 'crying') {
      eyes = `<path d="M-19 -121 Q-12 -130 -5 -121 M5 -121 Q12 -130 19 -121" fill="none" ${ST} stroke-width="3"/>`;

      mouth = `<path d="M-7 -96 Q0 -101 7 -96" fill="none" ${ST} stroke-width="2.5"/>`;

      ${rock(120, 530, 1, '#7a5e4d')}${rock(470, 360, 0.8, '#7a5e4d')}
      <ellipse cx="300" cy="446" rx="64" ry="11" fill="#6f5446"/>
      ${dog({ x: 560, y: 236, s: 0.72, expr: 'grumpy', toss: true, rot: -10 })}
      ${daisy({ x: 300, y: 446, s: 0.85, expr: 'surprised' })}
      ${mark(250, 250, '!', 52, '#d9534f', -8)}`);
    },

    c5b() {
      return finish(`${skyRect('skyDusk')}
      ${volcano(560, 660, 1.25, true)}
      ${dog({ x: 470, y: 316, s: 0.36, expr: 'surprised', flip: true })}
      ${speed(440, 420, 70, 3, 20, '#fff')}
      ${daisy({ x: 300, y: 506, s: 0.82, flip: true, carrotOn: true, watch: true, expr: 'joy', rot: 18 })}
      <g transform="translate(118 118)"><circle r="78" fill="#fff" ${ST}/><circle r="66" fill="none" stroke="#6b9e5e" stroke-width="6"/>
      ${mark(0, -14, '5 4 3', 30, INK)}${mark(0, 26, '2 1!', 34, '#d9534f')}</g>`);
    },

    c5c() {
      const bands = ['#f7a6a6', '#fcd28a', '#fff1a0', '#b8e2a4', '#a8d3f0', '#c7b5ee'];
      const rainbow = bands.map((c, i) => `<path d="M${80 + i * 18} 470 A${320 - i * 18} ${320 - i * 18} 0 0 1 ${720 - i * 18} 470" stroke="${c}" stroke-width="18" fill="none" opacity=".8"/>`).join('');
      let confetti = '';
      for (let i = 0; i < 26; i++) {
        const cx = (i * 97) % 780 + 10, cy = (i * 53) % 260 + 20;
        confetti += `<rect x="${cx}" y="${cy}" width="10" height="6" rx="2" fill="${bands[i % 6]}" transform="rotate(${(i * 41) % 180} ${cx} ${cy})" stroke="${INK}" stroke-width="1"/>`;
      }
      return finish(`${skyRect()}${rainbow}${hills(470)}${confetti}
      ${eagle({ x: 640, y: 150, s: 0.66, flip: true })}
      ${horse({ x: 760, y: 590, s: 0.72, flip: true })}
      ${bb({ x: 560, y: 580, s: 0.8, expr: 'happy', armL: 150, armR: -150 })}
      ${rebecca({ x: 400, y: 578, s: 1, expr: 'happy', carrotHug: true })}
      ${daisy({ x: 220, y: 582, s: 1, cheer: true, expr: 'joy' })}
      ${sparkle(310, 330, 12)}${sparkle(480, 300, 10)}${sparkle(150, 300, 9)}
      ${tuft(40, 592)}${flower(120, 596, '#f59bbd')}`);
    },

    end() {
      return `<svg viewBox="-150 -260 300 280" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="0" cy="-110" r="140" fill="url(#glow)"/>
        ${daisy({ x: 0, y: 0, s: 1, cheer: true, expr: 'joy' })}${sparkle(-90, -190, 12)}${sparkle(100, -40, 10)}${sparkle(-110, -40, 8)}</svg>`;
    },
  };

  const portraits = {
    daisy: `<svg viewBox="-110 -205 230 225" aria-hidden="true">${daisy({ glass: true })}</svg>`,
    rebecca: `<svg viewBox="-110 -230 220 250" aria-hidden="true">${rebecca({ expr: 'happy' })}</svg>`,
    nella: `<svg viewBox="-150 -275 350 290" aria-hidden="true">${horse({ bow: false })}</svg>`,
    burglar: `<svg viewBox="-110 -230 220 250" aria-hidden="true">${bb({ expr: 'sneaky', carrotUp: true, armR: -140 })}</svg>`,
    golden: `<svg viewBox="-150 -120 250 170" aria-hidden="true">${eagle({})}</svg>`,
    lava: `<svg viewBox="-100 -180 220 200" aria-hidden="true">${dog({ expr: 'grumpy' })}</svg>`,
  };

  root.Art = { DEFS, scenes, portraits };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  const S = Art.scenes;
  const squiggle = '<svg class="squiggle" viewBox="0 0 120 12" aria-hidden="true"><path d="M2 7 Q12 1 22 7 T42 7 T62 7 T82 7 T102 7 T118 6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>';

  const story = [
    { ch: 'Chapter One', opens: true, art: 'c1a', alt: 'Daisy the duck finds Rebecca the bunny crying outside her house, next to an empty spot in her carrot patch.', text: [
      'One afternoon, Daisy the duck was walking past Rebecca’s house when she heard somebody crying.',
      '“Rebecca, is that you?” asked Daisy.',
      '“Yeeess, it’s me,” sniffled Rebecca the bunny.',
      'Daisy was shocked to hear that Rebecca’s lucky carrot had gone missing! But Daisy was always happy to help, because she was Detective Daisy!' ] },
    { ch: 'Chapter One', art: 'c1b', alt: 'Daisy looks through her magnifying glass at a trail of paw prints leading to a red horse barn, with Rebecca behind her.', text: [
      'First, she took out her magnifying glass and looked for clues. The first clue was a trail of mysterious animal footprints. Daisy followed the footprints, with Rebecca right behind her. The footprints led them to a horse barn, and it was filled with horses and carrots!' ] },
    { ch: 'Chapter One', art: 'c1c', alt: 'Nella the horse stands beside her pile of five carrots. The fifth carrot is glowing. Daisy is thinking and Rebecca points at it.', text: [
      'Soon they spotted Nella the horse’s carrot pile. While Daisy was thinking of a plan, Rebecca looked closely and saw that the fifth carrot in Nella’s pile was her lucky carrot!' ] },
    { ch: 'Chapter Two', opens: true, art: 'c2a', alt: 'Daisy holds a bucket of sweet carrots while the horses, including Nella, come galloping out of the barn.', text: [
      'At last, Daisy came up with a good plan. Rebecca quickly reminded her, “Remember, my lucky carrot is the fifth one!” Daisy still went ahead with her plan, because she knew it would work.',
      'So Daisy quickly got a whole bucket of sweet carrots. All the horses came galloping out of the barn to eat them. Nella sniffed the sweet smell of the carrots and joined the other horses too.' ] },
    { ch: 'Chapter Two', art: 'c2b', alt: 'Bunny Burglar, wearing a mask and a striped shirt, runs off with the lucky carrot. Daisy is furious and Rebecca is shocked.', text: [
      'But just then, another bunny appeared. It was Bunny Burglar! He snatched the lucky carrot and ran away. Daisy was so furious!' ] },
    { ch: 'Chapter Three', opens: true, art: 'c3a', alt: 'Daisy and Rebecca climb Mount Large while Bunny Burglar sneaks past below. Golden the eagle spots him from the sky.', text: [
      'Huff, puff, huff! Daisy and Rebecca were on Mount Large, the tallest mountain in Happy City, searching for Bunny Burglar. Even though Rebecca was a bunny, she couldn’t climb very well. Daisy could swim, but she couldn’t climb well either.',
      'They were so busy talking that they didn’t see Bunny Burglar walk right past them! Luckily, Golden the eagle spotted him and immediately told Daisy.' ] },
    { ch: 'Chapter Three', art: 'c3b', alt: 'A house built from lots of carrots. Bunny Burglar stands in the doorway looking sorry, while Rebecca and Daisy stand outside.', text: [
      'Daisy and Rebecca followed Bunny Burglar to a house made of lots and lots of carrots. Rebecca knocked on the door, and Bunny Burglar opened it. He was very sorry for taking Rebecca’s lucky carrot and for stealing all the other carrots too.' ] },
    { ch: 'Chapter Four', opens: true, art: 'c4a', alt: 'A big pile of returned carrots. Daisy inspects it with her magnifying glass while Bunny Burglar thinks about a dog burying a carrot.', text: [
      'Daisy and Rebecca were lucky that Bunny Burglar agreed to give all the carrots back. But which one was Rebecca’s lucky carrot?',
      'Bunny Burglar said he had given the lucky carrot to a dog to bury.',
      'Daisy asked, “Did you put the lucky carrot in this pile? And can we go and see that dog?”' ] },
    { ch: 'Chapter Four', art: 'c4b', alt: 'Bunny Burglar points to a smoking volcano far away. Daisy and Rebecca look shocked.', text: [
      '“Um, hmm,” said Bunny Burglar. “That’s the only carrot that isn’t here. But I’m not sure you’ll like him. He’s not from Happy City. He’s from Grump Pup Village!”',
      'Daisy and Rebecca were shocked. Bunny Burglar told them that Grump Pup Village was on Lava Volcano.' ] },
    { ch: 'Chapter Four', art: 'c4c', alt: 'Daisy walks bravely along the path toward Lava Volcano and a sign for Grump Pup Village, while Rebecca and Bunny Burglar stay behind.', text: [
      'Even though it was dangerous, Daisy still decided to go. Rebecca stayed behind with Bunny Burglar.' ] },
    { ch: 'Chapter Five', opens: true, art: 'c5a', alt: 'At the top of the volcano, Lava the grumpy dog holds the lucky carrot up high, about to toss it in. Daisy watches in surprise.', text: [
      'As Daisy climbed up the steep volcano, she saw a dog. It was Lava the grump pup! Lava was about to toss the lucky carrot into the volcano!' ] },
    { ch: 'Chapter Five', art: 'c5b', alt: 'The volcano erupts as Daisy slides down its side, holding the lucky carrot up high. A watch counts down five, four, three, two, one.', text: [
      'Daisy checked her watch and counted, “Five… four… three… two… one!” Then she quickly jumped up and caught the lucky carrot. She went sliding down the side of the volcano just as it erupted, and she landed safely on the ground.' ] },
    { ch: 'Chapter Five', art: 'c5c', alt: 'Everyone celebrates under a rainbow. Rebecca hugs her glowing lucky carrot next to Daisy, Bunny Burglar, Nella, and Golden.', text: [
      'When Daisy got back, she told her friends all about Lava the dog, the erupting volcano, and everything that had happened. Rebecca was so happy to have her lucky carrot back, and it was all thanks to the brave and kind Detective Daisy!' ] },
  ];

  const cast = [
    ['daisy', 'Daisy', 'A duck, also known as Detective Daisy'],
    ['rebecca', 'Rebecca', 'A bunny who loses her lucky carrot'],
    ['nella', 'Nella', 'A horse with a pile of carrots'],
    ['burglar', 'Bunny Burglar', 'A bunny who takes the carrots'],
    ['golden', 'Golden', 'An eagle who spots Bunny Burglar'],
    ['lava', 'Lava', 'A grump pup from Grump Pup Village'],
  ];

  const pages = [{ type: 'cover' }, { type: 'cast' }, ...story.map((p) => Object.assign({ type: 'story' }, p)), { type: 'end' }];
  const total = pages.length;

  const book = document.getElementById('book');
  const trail = document.getElementById('trail');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const count = document.getElementById('count');
  const readTools = document.getElementById('read-tools');
  const KEY = 'detective-daisy-page';

  let current = 0;
  const canRead = !!(window.ReadAloud && ReadAloud.supported);
  const voice = canRead ? ReadAloud.attach({
    button: document.getElementById('read'),
    label: document.getElementById('read-label'),
    picker: document.getElementById('voice-pick'),
    getText: () => {
      const p = pages[current];
      return p.type === 'story' ? (p.opens ? p.ch + '. ' : '') + p.text.join(' ') : '';
    },
  }) : { stop() {} };
  const seen = new Set([0]);

  const foot = '<svg viewBox="0 0 24 26" aria-hidden="true"><path d="M12 25 C9 25 8 22 8.6 19 L2.4 7.6 C4.6 8.2 6.8 9 8.4 10.8 L9.4 2.6 C10.8 4.6 11.6 7 12 9.4 C12.4 7 13.2 4.6 14.6 2.6 L15.6 10.8 C17.2 9 19.4 8.2 21.6 7.6 L15.4 19 C16 22 15 25 12 25 Z" fill="currentColor"/></svg>';
  trail.innerHTML = pages.map((_, i) => `<li><button type="button" data-i="${i}" aria-label="Go to page ${i + 1}">${foot}</button></li>`).join('');
  trail.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(Number(b.dataset.i)); });

  function pageHTML(i) {
    const p = pages[i];
    if (p.type === 'cover') {
      return `<section class="page title-page">
          <h1><span class="t1">Detective Daisy</span><span class="t2">and the Mystery of the Missing Lucky Carrot</span></h1>
          ${window.StorySite ? StorySite.publishedLine() : ''}
          <p class="hint">A story in five chapters. Turn the pages with the buttons below, or use the arrow keys.</p>
          <button class="pill" type="button" data-go="1">Open the book</button>
        </section>
        <section class="page art"><div class="art-frame" role="img" aria-label="Detective Daisy the duck stands on a lily pad with her magnifying glass, looking at mysterious paw prints. Her friends watch from the bank.">${S.cover()}</div></section>`;
    }
    if (p.type === 'cast') {
      return `<section class="cast"><h2>Meet the characters</h2><ul>${cast.map(([k, n, w]) =>
        `<li><div class="portrait">${Art.portraits[k]}</div><div><p class="name">${n}</p><p class="what">${w}</p></div></li>`).join('')}</ul>
        <span class="folio">${i + 1}</span></section>`;
    }
    if (p.type === 'end') {
      return `<section class="page art"><div class="art-frame" role="img" aria-label="Detective Daisy cheering with sparkles around her.">${S.end()}</div></section>
        <section class="page end-page"><h2>The End</h2><p>Case closed! Rebecca has her lucky carrot back, all thanks to Detective Daisy.</p>
        <button class="pill" type="button" data-go="0">Read it again</button>${window.StorySite ? StorySite.endButtons() : ''}</section>`;
    }
    const firstOfChapter = !!p.opens;
    return `<section class="page art"><div class="art-frame" role="img" aria-label="${p.alt}">${S[p.art]()}</div></section>
      <section class="page words${firstOfChapter ? ' opens' : ''}">
        ${firstOfChapter ? `<h2 class="chapter">${p.ch}</h2>${squiggle}` : `<p class="running">${p.ch}</p>`}
        ${p.text.map((t) => `<p class="text">${t}</p>`).join('')}
        <span class="folio">${i + 1}</span>
      </section>`;
  }

  function go(i, fromLoad) {
    if (i < 0 || i >= total) return;
    const dir = i >= current ? 'turn-next' : 'turn-prev';
    voice.stop();
    current = i;
    seen.add(i);
    book.classList.remove('turn-next', 'turn-prev', 'single');
    book.innerHTML = pageHTML(i);
    if (pages[i].type === 'cast') book.classList.add('single');
    if (!fromLoad) { void book.offsetWidth; book.classList.add(dir); }
    prev.disabled = i === 0;
    next.disabled = i === total - 1;
    count.textContent = `${i + 1} / ${total}`;
    trail.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('seen', seen.has(k));
      if (k === i) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    readTools.hidden = !canRead || pages[i].type !== 'story';
    try { localStorage.setItem(KEY, String(i)); } catch (e) {}
    if (!fromLoad && window.matchMedia('(max-width: 760px)').matches) window.scrollTo({ top: 0 });
  }

  book.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(Number(b.dataset.go)); });
  prev.addEventListener('click', () => go(current - 1));
  next.addEventListener('click', () => go(current + 1));
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight') { go(current + 1); }
    if (e.key === 'ArrowLeft') { go(current - 1); }
  });
  let sx = null, sy = null;
  book.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  book.addEventListener('touchend', (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(current + (dx < 0 ? 1 : -1));
    sx = null;
  });

  let start = 0;
  try { const v = Number(localStorage.getItem(KEY)); if (Number.isInteger(v) && v >= 0 && v < total) start = v; } catch (e) {}
  for (let k = 0; k <= start; k++) seen.add(k);
  go(start, true);
})();
</script>
</body>
</html>
