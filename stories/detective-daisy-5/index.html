    let eye = `<ellipse cx="24" cy="-122" rx="10" ry="12" fill="#fff" ${ST} stroke-width="2.5"/><circle cx="27" cy="-120" r="5.5" fill="${INK}"/><circle cx="29" cy="-123" r="2" fill="#fff"/>`;

      items = bucket(80, 2, 0.85);

    let backWing = '';
    if (carrotOn || cheer) {
      backWing = `<path d="M-6 -78 Q-40 -104 -64 -150 Q-62 -166 -50 -162 Q-50 -178 -36 -174 Q-30 -186 -18 -176 Q-8 -128 16 -80 Z" fill="#f5c233" ${ST}/>`;
      wing = '';

    { ch: 'Chapter Three', art: 'c3c', alt: 'Daisy talks kindly to a sad Bella, who is thinking about a pumpkin.', text: [
      'Daisy asked, “Why are you stealing our Halloween decorations without asking, Bella?”',
      '“It’s because at Halloween, us bats don’t have any,” said Bella.',
      'Daisy said to her that she could borrow, but not steal.' ] },
    { ch: 'Chapter Four', opens: true, art: 'c4a', alt: 'A cross Bella flies away with a bucket of candy and a pumpkin, dropping sweets, while Daisy watches in surprise.', text: [
      'But little Bella didn’t know how to borrow at all! Bella only knew how to steal. So Bella got mad and stole the decorations and the candy once again.' ] },
    { ch: 'Chapter Four', art: 'c4b', alt: 'Daisy stands with the pumpkin and candy she has taken back while Bella sits very still, looking worn out.', text: [
      'But Daisy kept taking them back, and soon Bella was tired. She went from sad, to quiet, to completely frozen.' ] },
    { ch: 'Chapter Four', art: 'c4c', alt: 'Daisy turns back towards the cave, where Bella sits crying at the entrance.', text: [
      'Daisy and her friends tiptoed back to Happy City with all their things. But then Daisy heard Bella crying.',
      '“Sniff, sniff. I only stole the things because my town never had Halloween things at Halloween. Waa-ah-ah-ah!”' ] },
    { ch: 'Chapter Four', art: 'c4d', alt: 'Daisy smiles at Bella with hearts floating between them.', text: [
      'Daisy responded, “Oh Bella, oh Bella, you’re so silly. You don’t need Halloween things on Halloween. You just need friends.”' ] },
    { ch: 'Chapter Five', opens: true, art: 'c5a', alt: 'Bella looks puzzled with question marks above her head while Daisy cheers.', text: [
      '“Huh? We need Halloween friends, not Halloween things?” asked Bella.',
      '“Yes, of course you need friends at Halloween,” answered Daisy.' ] },
    { ch: 'Chapter Five', art: 'c5b', alt: 'Daisy has a bright idea in the nearly bare cavern, and Bella smiles.', text: [
      '“Well, you see, in our city we’re having a Halloween party. But the problem is that we don’t have enough things,” said Bella.',
      'Daisy had an idea! “Hey, what if you invite us to the party? Then we might be able to help you.”' ] },
    { ch: 'Chapter Six', opens: true, art: 'c6a', alt: 'Bella flies over Happy City dropping party invitations to Rebecca and Millie.', text: [
      'Bella gave invitations to Happy City, but then she told them to help and share their candy and decorations for the Batty Cavern party.' ] },
    { ch: 'Chapter Six', art: 'c6b', alt: 'Emily Elephant, Biggie Buffalo, Rebecca, Daisy and Golden carry decorations to the Batty Cavern, where Bella waits.', text: [
      'Daisy, Rebecca, Biggie Buffalo, Emily Elephant and Golden all agreed to come to the party. Soon everyone from Happy City was in the Batty Cavern.' ] },
    { ch: 'Chapter Seven', opens: true, art: 'c7a', alt: 'Daisy and Bella cheer together at the Halloween party in the decorated cavern, with friends, bats, pumpkins and flags all around.', text: [
      '“Thank you so much, Daisy! Now the bats are all happy, and the same for Happy City,” said Bella happily. “You are definitely a true detective, but also an amazing superhero!” added Bella.',
      '“Aw, thank you. That’s so kind, Bella,” said Daisy.' ] },
  ];

  const cast = [
    ['daisy', 'Daisy Duck', 'A detective in a witch hat'],
    ['rebecca', 'Rebecca Rabbit', 'Daisy’s trick-or-treat friend'],
    ['golden', 'Golden the Eagle', 'He spots Bella from the sky'],
    ['biggie', 'Biggie Buffalo', 'Strong enough to carry pumpkins'],
    ['millie', 'Millie Meerkat', 'She gives out the candy'],
    ['bella', 'Bella the Bat', 'The baddest bat in Batty Cavern'],
    ['emily', 'Emily Elephant', 'A big, gentle helper'],
  ];

  const pages = [{ type: 'cover' }, { type: 'cast' }, ...story.map((p) => Object.assign({ type: 'story' }, p)), { type: 'end' }];
  const total = pages.length;

  const book = document.getElementById('book');
  const trail = document.getElementById('trail');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const count = document.getElementById('count');
  const readTools = document.getElementById('read-tools');
  const KEY = 'storyshelf:halloween:page';

  let current = 0;
  const canRead = !!(window.ReadAloud && ReadAloud.supported);
  const voice = canRead ? ReadAloud.attach({
    button: document.getElementById('read'),
    label: document.getElementById('read-label'),
    picker: document.getElementById('voice-pick'),
    getText: () => {
      const p = pages[current];
      return p.type === 'story' ? (p.opens ? p.ch + '. ' : '') + p.text.join(' ') : '';
    },
  }) : { stop() {} };
  const seen = new Set([0]);

  const foot = '<svg viewBox="0 0 24 26" aria-hidden="true"><path d="M12 25 C9 25 8 22 8.6 19 L2.4 7.6 C4.6 8.2 6.8 9 8.4 10.8 L9.4 2.6 C10.8 4.6 11.6 7 12 9.4 C12.4 7 13.2 4.6 14.6 2.6 L15.6 10.8 C17.2 9 19.4 8.2 21.6 7.6 L15.4 19 C16 22 15 25 12 25 Z" fill="currentColor"/></svg>';
  trail.innerHTML = pages.map((_, i) => `<li><button type="button" data-i="${i}" aria-label="Go to page ${i + 1}">${foot}</button></li>`).join('');
  trail.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(Number(b.dataset.i)); });

  function pageHTML(i) {
    const p = pages[i];
    if (p.type === 'cover') {
      return `<section class="page title-page">
          <h1><span class="t1">Duckie Mysterys</span><span class="t2">Halloween</span></h1>
          <p class="byline">Written by Akie</p>
          ${window.StorySite ? StorySite.publishedLine() : ''}
          <p class="hint">A story in seven chapters. Turn the pages with the buttons below, or use the arrow keys.</p>
          <button class="pill" type="button" data-go="1">Open the book</button>
        </section>
        <section class="page art"><div class="art-frame" role="img" aria-label="Daisy the duck in a witch hat, holding her magnifying glass on a Halloween night, with glowing pumpkins, decorated houses and Bella the bat flying past the moon.">${S.cover()}</div></section>`;
    }
    if (p.type === 'cast') {
      return `<section class="cast"><h2>Meet the characters</h2><ul>${cast.map(([k, n, w]) =>
        `<li><div class="portrait">${Art.portraits[k]}</div><div><p class="name">${n}</p><p class="what">${w}</p></div></li>`).join('')}</ul>
        <span class="folio">${i + 1}</span></section>`;
    }
    if (p.type === 'end') {
      return `<section class="page art"><div class="art-frame" role="img" aria-label="Daisy cheering in her witch hat beside Bella the bat and a glowing pumpkin, with sparkles all around.">${S.end()}</div></section>
        <section class="page end-page"><h2>The End</h2><p>The bats had their Halloween party after all, and lots of new friends too.</p>
        <button class="pill" type="button" data-go="0">Read it again</button>${window.StorySite ? StorySite.endButtons() : ''}</section>`;
    }
    const firstOfChapter = !!p.opens;
    return `<section class="page art"><div class="art-frame" role="img" aria-label="${p.alt}">${S[p.art]()}</div></section>
      <section class="page words${firstOfChapter ? ' opens' : ''}">
        ${firstOfChapter ? `<h2 class="chapter">${p.ch}</h2>${squiggle}` : `<p class="running">${p.ch}</p>`}
        ${p.text.map((t) => `<p class="text">${t}</p>`).join('')}
        <span class="folio">${i + 1}</span>
      </section>`;
  }

  function go(i, fromLoad) {
    if (i < 0 || i >= total) return;
    const dir = i >= current ? 'turn-next' : 'turn-prev';
    voice.stop();
    current = i;
    seen.add(i);
    book.classList.remove('turn-next', 'turn-prev', 'single');
    book.innerHTML = pageHTML(i);
    if (pages[i].type === 'cast') book.classList.add('single');
    if (!fromLoad) { void book.offsetWidth; book.classList.add(dir); }
    prev.disabled = i === 0;
    next.disabled = i === total - 1;
    count.textContent = `${i + 1} / ${total}`;
    trail.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('seen', seen.has(k));
      if (k === i) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    readTools.hidden = !canRead || pages[i].type !== 'story';
    try { localStorage.setItem(KEY, String(i)); } catch (e) {}
    if (!fromLoad && window.matchMedia('(max-width: 760px)').matches) window.scrollTo({ top: 0 });
  }

  book.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(Number(b.dataset.go)); });
  prev.addEventListener('click', () => go(current - 1));
  next.addEventListener('click', () => go(current + 1));
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight') { go(current + 1); }
    if (e.key === 'ArrowLeft') { go(current - 1); }
  });
  let sx = null, sy = null;
  book.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  book.addEventListener('touchend', (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(current + (dx < 0 ? 1 : -1));
    sx = null;
  });

  let start = 0;
  try { const v = Number(localStorage.getItem(KEY)); if (Number.isInteger(v) && v >= 0 && v < total) start = v; } catch (e) {}
  for (let k = 0; k <= start; k++) seen.add(k);
  go(start, true);
})();
</script>
</body>
</html>
