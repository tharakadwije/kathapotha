      backWing = `<path d="M-6 -78 Q-40 -104 -64 -150 Q-62 -166 -50 -162 Q-50 -178 -36 -174 Q-30 -186 -18 -176 Q-8 -128 16 -80 Z" fill="#f5c233" ${ST}/>`;
      wing = '';
      if (carrotOn) backWing = carrot(-60, -196, 36, 0.78, true) + backWing;
    }
    const w = watch ? `<rect x="-12" y="-66" width="20" height="8" fill="#6b9e5e" transform="rotate(20 -2 -62)"/><circle cx="-2" cy="-62" r="9" fill="#fff" ${ST} stroke-width="2.5"/><path d="M-2 -62 L-2 -68 M-2 -62 L3 -60" stroke="${INK}" stroke-width="2"/>` : '';

    return `<g transform="${T(x, y, s, flip, rot)}" filter="url(#wob)">

    <path d="M-14 -14 L-16 -4 M14 -14 L16 -4" ${ST} fill="none"/>
    <path d="M-36 0 Q-22 -14 -2 0 Z" fill="#f59e3b" ${ST}/><path d="M4 0 Q22 -14 38 0 Z" fill="#f59e3b" ${ST}/>
    <ellipse cx="0" cy="-58" rx="50" ry="48" fill="#ffd84d" ${ST}/>

  const KEY = 'storyshelf:christmas-rescue:page';

  let current = 0;
  const canRead = !!(window.ReadAloud && ReadAloud.supported);
  const voice = canRead ? ReadAloud.attach({
    button: document.getElementById('read'),
    label: document.getElementById('read-label'),
    picker: document.getElementById('voice-pick'),
    getText: () => {
      const p = pages[current];
      return p.type === 'story' ? (p.opens ? p.ch + '. ' : '') + p.text.join(' ') : '';
    },
  }) : { stop() {} };
  const seen = new Set([0]);

  const foot = '<svg viewBox="0 0 24 26" aria-hidden="true"><path d="M12 25 C9 25 8 22 8.6 19 L2.4 7.6 C4.6 8.2 6.8 9 8.4 10.8 L9.4 2.6 C10.8 4.6 11.6 7 12 9.4 C12.4 7 13.2 4.6 14.6 2.6 L15.6 10.8 C17.2 9 19.4 8.2 21.6 7.6 L15.4 19 C16 22 15 25 12 25 Z" fill="currentColor"/></svg>';
  trail.innerHTML = pages.map((_, i) => `<li><button type="button" data-i="${i}" aria-label="Go to page ${i + 1}">${foot}</button></li>`).join('');
  trail.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(Number(b.dataset.i)); });

  function pageHTML(i) {
    const p = pages[i];
    if (p.type === 'cover') {
      return `<section class="page title-page">
          <h1><span class="t1">Duckie Mysterys</span><span class="t2">The Christmas Rescue</span></h1>
          <p class="byline">Written by Akie</p>
          ${window.StorySite ? StorySite.publishedLine() : ''}
          <p class="hint">A story in five chapters. Turn the pages with the buttons below, or use the arrow keys.</p>
          <button class="pill" type="button" data-go="1">Open the book</button>
        </section>
        <section class="page art"><div class="art-frame" role="img" aria-label="Daisy the duck in a Santa hat, holding her magnifying glass in a snowy village at night, with a lit Christmas tree and a snowman.">${S.cover()}</div></section>`;
    }
    if (p.type === 'cast') {
      return `<section class="cast"><h2>Meet the characters</h2><ul>${cast.map(([k, n, w]) =>
        `<li><div class="portrait">${Art.portraits[k]}</div><div><p class="name">${n}</p><p class="what">${w}</p></div></li>`).join('')}</ul>
        <span class="folio">${i + 1}</span></section>`;
    }
    if (p.type === 'end') {
      return `<section class="page art"><div class="art-frame" role="img" aria-label="Daisy cheering in her Santa hat beside a little Christmas tree, with sparkles all around.">${S.end()}</div></section>
        <section class="page end-page"><h2>The End</h2><p>Santa made it home in time, all thanks to Daisy and her friends.</p>
        <button class="pill" type="button" data-go="0">Read it again</button>${window.StorySite ? StorySite.endButtons() : ''}</section>`;
    }
    const firstOfChapter = !!p.opens;
    return `<section class="page art"><div class="art-frame" role="img" aria-label="${p.alt}">${S[p.art]()}</div></section>
      <section class="page words${firstOfChapter ? ' opens' : ''}">
        ${firstOfChapter ? `<h2 class="chapter">${p.ch}</h2>${squiggle}` : `<p class="running">${p.ch}</p>`}
        ${p.text.map((t) => `<p class="text">${t}</p>`).join('')}
        <span class="folio">${i + 1}</span>
      </section>`;
  }

  function go(i, fromLoad) {
    if (i < 0 || i >= total) return;
    const dir = i >= current ? 'turn-next' : 'turn-prev';
    voice.stop();
    current = i;
    seen.add(i);
    book.classList.remove('turn-next', 'turn-prev', 'single');
    book.innerHTML = pageHTML(i);
    if (pages[i].type === 'cast') book.classList.add('single');
    if (!fromLoad) { void book.offsetWidth; book.classList.add(dir); }
    prev.disabled = i === 0;
    next.disabled = i === total - 1;
    count.textContent = `${i + 1} / ${total}`;
    trail.querySelectorAll('button').forEach((b, k) => {
      b.classList.toggle('seen', seen.has(k));
      if (k === i) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    readTools.hidden = !canRead || pages[i].type !== 'story';
    try { localStorage.setItem(KEY, String(i)); } catch (e) {}
    if (!fromLoad && window.matchMedia('(max-width: 760px)').matches) window.scrollTo({ top: 0 });
  }

  book.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(Number(b.dataset.go)); });
  prev.addEventListener('click', () => go(current - 1));
  next.addEventListener('click', () => go(current + 1));
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight') { go(current + 1); }
    if (e.key === 'ArrowLeft') { go(current - 1); }
  });
  let sx = null, sy = null;
  book.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  book.addEventListener('touchend', (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(current + (dx < 0 ? 1 : -1));
    sx = null;
  });

  let start = 0;
  try { const v = Number(localStorage.getItem(KEY)); if (Number.isInteger(v) && v >= 0 && v < total) start = v; } catch (e) {}
  for (let k = 0; k <= start; k++) seen.add(k);
  go(start, true);
})();
</script>
</body>
</html>
